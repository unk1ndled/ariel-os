name: Rustdoc Annotations

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  rustdoc:
    name: Run Rustdoc and Annotate Warnings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run rustdoc
        run: |
          cargo clean
          cargo doc --document-private-items 2> rustdoc_warnings.log || true

      - name: Parse and Annotate Rustdoc Warnings
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const warnings = fs.readFileSync('rustdoc_warnings.log', 'utf8');
            const annotationRegex = /(.+?):(\d+):(\d+):\s+warning:\s+(.*)/g;

            let match;
            const annotations = [];
            while ((match = annotationRegex.exec(warnings)) !== null) {
              const [, file, line, col, message] = match;
              annotations.push({
                path: file,
                start_line: parseInt(line, 10),
                end_line: parseInt(line, 10),
                annotation_level: 'warning',
                message,
              });

              github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Rustdoc Annotations',
                head_sha: context.payload.pull_request.head.sha,
                output: {
                  title: 'Rustdoc Warning',
                  summary: message,
                  annotations: [
                    {
                      path: file,
                      start_line: parseInt(line, 10),
                      end_line: parseInt(line, 10),
                      annotation_level: 'warning',
                      message,
                    },
                  ],
                },
              });
            }

            // Save parsed annotations to a JSON file
            fs.writeFileSync('rustdoc_parsed_warnings.json', JSON.stringify(annotations, null, 2));

      - name: Upload Parsed Rustdoc Warnings
        uses: actions/upload-artifact@v4
        with:
          name: rustdoc-parsed-warnings
          path: rustdoc_parsed_
